name: Windows
on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-port']
  pull_request:
    paths: ['src/**', 'windows/**', 'scripts/**', 'test/**', 'package*.json', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:windows
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: HeptaFloat-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            build/windows-smoke.json
