<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow HeptaBase · 開啟卡片</title><link rel="stylesheet" href="style.css"></head>
<body><main><p class="eyebrow">FLOW HEPTABASE</p><h1>在小視窗閱讀卡片</h1>
<p id="status" role="status">正在準備卡片連結…</p>
<p id="launch-error" class="error" role="alert" hidden></p>
<div class="actions"><a id="open-app" class="primary" hidden>以 Flow HeptaBase 開啟</a><button id="open-web" hidden>改用 Heptabase 網頁版</button></div>
<p class="hint">桌面開啟需要已安裝本機橋接，並啟用擴充功能的新增權限。沒有安裝桌面程式也可以繼續使用網頁。</p>
<p class="hint"><a id="open-protocol" hidden>改用 Windows 協定連結</a>（瀏覽器可能要求確認）</p>
<p class="hint">此頁不讀取卡片內容、不要求登入。開卡請求成功後，會依設定關閉此分頁；失敗時保留重試與網頁版選項。</p>
<p id="reload-hint" class="hint" hidden>背景元件仍是舊版。請進入橋接設定，按「重新載入橋接」，再重開卡片連結。</p>
<button id="settings" class="quiet">橋接設定</button><p id="bridge-version" class="hint"></p></main><script src="handoff.js"></script></body></html>
