<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flow HeptaBase · 橋接設定</title><link rel="stylesheet" href="style.css"></head>
<body><main><p class="eyebrow">FLOW HEPTABASE</p><h1>連結橋接設定</h1>
<label><input id="auto-launch" type="checkbox"> 嘗試自動開啟桌面預覽</label><p class="hint">瀏覽器仍可能要求確認。關閉後會停在選擇頁，讓你自行按下開啟。</p>
<label><input id="auto-close" type="checkbox"> 送出開卡請求後，自動關閉中繼頁</label><p class="hint">預設開啟。本機橋接回覆成功後關閉；失敗時保留錯誤、重試及網頁版選項。</p>
<label><input id="intercept-all" type="checkbox"> 攔截所有合法 Heptabase 卡片連結</label><p class="hint">預設關閉。開啟後，一般瀏覽器中的卡片連結也會進入預覽選擇頁，無法只識別 Discord 來源。通常只需處理 Bot 的 flowhepta=1 標記連結。</p>
<p id="status" role="status"></p><p class="hint">設定只儲存在這個瀏覽器的本機擴充功能空間。停用或移除本擴充功能，即恢復原本的網頁開啟方式。</p>
<p id="reload-hint" class="hint" hidden>已更新檔案，但背景元件仍是舊版。請重新載入後重開卡片連結；你的選項會保留。</p>
<button id="reload-bridge" type="button">重新載入橋接</button><p id="bridge-version" class="hint"></p></main><script src="options.js"></script></body></html>
